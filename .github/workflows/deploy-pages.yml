name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar versão de cache/build
        run: |
          VERSION="$(date -u +'%Y-%m-%d')-${GITHUB_SHA::7}"
          sed -i "s/const CACHE_NAME = \".*\";/const CACHE_NAME = \"minha-pressao-${VERSION}\";/" service-worker.js
          sed -i "s/const APP_BUILD = \".*\";/const APP_BUILD = \"${VERSION}\";/" js/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
